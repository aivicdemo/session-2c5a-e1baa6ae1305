<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みなと修理カルテ - ログイン画面</title>
  <style>
    :root {
      --primary: #c85a3a;
      --primary-hover: #a84830;
      --bg-main: #f4ede5;
      --bg-card: #ebe2d9;
      --bg-sidebar: #e5dcd2;
      --border: #d4c9bd;
      --text: #2a2420;
      --text-muted: #6b6460;
      --top-bar-bg: #8b6f47;
      --top-bar-border: #7a6040;
      --top-bar-text: #fef9f3;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius-card: 12px;
      --radius-control: 8px;
      --shadow-card: 0 2px 8px rgba(42, 36, 32, 0.08);
      --border-width: 1px;
      --control-height: 56px;
      --space-unit: 8px;
      --motion-duration: 200ms;
      --surface-texture: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(42, 36, 32, 0.02) 2px, rgba(42, 36, 32, 0.02) 4px), repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(42, 36, 32, 0.01) 2px, rgba(42, 36, 32, 0.01) 4px);
      --surface-texture-size: 100% 100%;
      --surface-texture-position: 0 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font-family);
      background: var(--bg-main);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: calc(var(--space-unit) * 2);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--space-unit) * 6);
      box-shadow: var(--shadow-card);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
    }

    .login-header {
      margin-bottom: calc(var(--space-unit) * 5);
      text-align: center;
    }

    .login-logo {
      display: inline-block;
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: calc(var(--radius-control) * 1.5);
      margin-bottom: calc(var(--space-unit) * 2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--top-bar-text);
      font-size: 24px;
      box-shadow: 0 2px 6px rgba(200, 90, 58, 0.15);
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.5;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1.5);
    }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.3px;
    }

    .form-input {
      width: 100%;
      height: var(--control-height);
      padding: 0 calc(var(--space-unit) * 2);
      font-size: 16px;
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      background: #fef9f3;
      color: var(--text);
      font-family: var(--font-family);
      transition: all var(--motion-duration) ease;
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(200, 90, 58, 0.1);
      background-color: #fef9f3;
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .login-button {
      height: var(--control-height);
      background: var(--primary);
      color: var(--top-bar-text);
      border: none;
      border-radius: var(--radius-control);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--motion-duration) ease;
      font-family: var(--font-family);
      letter-spacing: 0.3px;
      box-shadow: 0 2px 8px rgba(200, 90, 58, 0.2);
      margin-top: calc(var(--space-unit) * 1);
    }

    .login-button:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(200, 90, 58, 0.3);
      transform: translateY(-1px);
    }

    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(200, 90, 58, 0.2);
    }

    .login-footer {
      margin-top: calc(var(--space-unit) * 5);
      padding-top: calc(var(--space-unit) * 4);
      border-top: var(--border-width) solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: calc(var(--space-unit) * 4);
      }

      .login-title {
        font-size: 24px;
      }

      .login-subtitle {
        font-size: 13px;
      }

      .form-input {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .form-input,
      .login-button {
        transition: none;
      }

      .login-button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">⚙</div>
        <h1 class="login-title" data-testid="login-title">みなと修理カルテ</h1>
        <p class="login-subtitle">修理業務管理システム</p>
      </div>

      <form class="login-form" data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button
          class="login-button"
          type="submit"
          data-testid="login-button"
        >
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <p>※ サンプル実装では、どの入力内容でもログインできます。</p>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
